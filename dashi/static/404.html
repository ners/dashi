<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark">
    <script>
      const path = location.href.split("/").slice(3);
      const newLocation = path.join("/");
      const isStatic = path[0] === "static";
      const hasExtensions = newLocation.indexOf('.') > -1;
      if (isStatic || hasExtensions) {
        document.addEventListener('DOMContentLoaded', function() {
          document.getElementsByTagName('body')[0].innerHTML = '<pre>Error 404</pre>';
        })
      } else {
        sessionStorage.redirect = newLocation;
        location.replace("/");
      }
    </script>
  </head>
  <body>
  </body>
</html>
