<!DOCTYPE html>
<html>
  <head>
<head>
    <script>
      const redirect = sessionStorage.redirect;
      if (redirect) {
        delete sessionStorage.redirect;
        window.history.replaceState(null, null, redirect);
      }
      const scheme = localStorage.getItem('colour-scheme');
      if (scheme) {
        document.documentElement.setAttribute('data-theme', JSON.parse(scheme));
      }
    </script>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dashi</title>
    <link rel="stylesheet" href="/static/dashi.css?v=0">
    <link rel="stylesheet" href="/static/style.css?v=0">
    <script src="/static/main.js?v=0" type="module"></script>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"><!-- 180×180 -->
  </head>
  <body>
    <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" id="dashi-loading" class="spinner">
    <style>
    .spinner1{
      transform-origin:center;
      animation:spinner3 2s linear infinite
    }
    .spinner1 circle{
      stroke-linecap:round;
      animation:spinner2 1.5s ease-in-out infinite
    }
    @keyframes spinner3{
      100%{transform:rotate(360deg)}
    }
    @keyframes spinner2{
      0%{stroke-dasharray:0 150;stroke-dashoffset:0}
      47.5%{stroke-dasharray:42 150;stroke-dashoffset:-16}
      95%,100%{stroke-dasharray:42 150;stroke-dashoffset:-59}
    }
    </style>
    <g class="spinner1">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke-width="3"></circle>
    </g>
    </svg>
  </body>
</html>
