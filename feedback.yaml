loops:
  default:
    hooks:
      before-all: |
        set -ex
        workdir=.feedback
        rm -fr $workdir
        nix build .#wasmPkgs.haskellPackages.dashi.staticAssetsNoCss
        cp -r "$(realpath ./result)" "$workdir"
        chmod -R +w "$workdir"

        ln -s "$(wasm32-wasi-cabal list-bin exe:dashi)" "$workdir/static/app.wasm"

        pushd "$workdir"/static
        for f in ../../dashi/static/*; do
          rm -fr "$(basename $f)"
          ln -s "$f" .
        done
        rm *.html
        pushd ..
        for f in ../dashi/static/*.html; do
          rm -fr "$(basename $f)"
          ln -s "$f" .
        done
        popd

        "$(wasm32-wasi-ghc --print-libdir)"/post-link.mjs --input app.wasm --output ghc_wasm_jsffi.js
        # hold @MagicRB accountable for this crime
        sed -i 's/var runBatch = /var initialSyncDepth = 0; &/' ghc_wasm_jsffi.js
        popd
    script: |
      set -ex
      workdir=.feedback
      cabal build dashi-style
      until [ -e $workdir/static ]; do
        sleep 1
      done
      eval "$(cabal list-bin exe:dashi-style)" > $workdir/static/dashi.css
      wasm32-wasi-cabal build lib:dashi exe:dashi
      http-server .feedback --brotli --gzip
